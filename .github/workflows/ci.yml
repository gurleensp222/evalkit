name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -m "not ollama" --cov=evalkit --cov-report=term-missing --cov-fail-under=80

      - name: Rubric lint
        run: evalkit rubrics lint --strict

      # The mock sample set passes 4 of 8 tasks. Fail if that rate drops.
      - name: Smoke eval
        env:
          PASS_RATE_THRESHOLD: "0.5"
        run: |
          output=$(evalkit run --provider mock)
          printf '%s\n' "$output"
          EVAL_OUTPUT="$output" python - <<'PY'
          import os
          import re
          import sys

          text = os.environ["EVAL_OUTPUT"]
          match = re.search(
              r"tasks:\s+(\d+)\s+attempts:\s+\d+\s+passed attempts:\s+\d+\s+"
              r"tasks passing all attempts:\s+(\d+)",
              text,
          )
          if match is None:
              print("could not read pass rate from evalkit output", file=sys.stderr)
              sys.exit(1)
          tasks = int(match.group(1))
          passed = int(match.group(2))
          rate = passed / tasks if tasks else 0.0
          threshold = float(os.environ["PASS_RATE_THRESHOLD"])
          print(f"pass rate {rate:.2f} (threshold {threshold:.2f})")
          if rate < threshold:
              sys.exit(1)
          PY

      - name: Build Docker image
        run: docker build -t evalkit .
