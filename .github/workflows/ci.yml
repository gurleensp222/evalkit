name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -m "not ollama" --cov=evalkit --cov-report=term-missing --cov-fail-under=80

      - name: Rubric lint
        run: evalkit rubrics lint --strict

      - name: Build Docker image
        run: docker build -t evalkit .
