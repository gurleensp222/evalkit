[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic",
    "pandas",
    "numpy",
    "fastapi",
    "uvicorn",
    "httpx",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["evalkit*"]
