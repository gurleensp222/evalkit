[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic",
    "pandas",
    "numpy",
    "fastapi",
    "uvicorn",
    "httpx",
    "typer",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
dashboard = [
    "streamlit",
]

[project.scripts]
evalkit = "evalkit.cli:app"

[tool.pytest.ini_options]
addopts = "-m 'not ollama'"
markers = [
    "ollama: live tests that call a local Ollama server",
]

[tool.setuptools.packages.find]
include = ["evalkit*"]
